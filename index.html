/* ── LIGHT THEME (default) ───────────────────────────────────────────────── */
:root {

  --row-hover: #EEF2FF; --row-hover-text: #4F46E5;
  --acc-hover: #F8FAFC;
  --chip-total-bg: #EEF2FF; --chip-total-txt: #312E81;
  --chip-today-bg: #FEF3C7; --chip-today-txt: #92400E;
  --chip-over-bg:  #FEE2E2; --chip-over-txt:  #991B1B;
  --count-red-bg:  #FEE2E2; --count-red-txt:  #991B1B;
  --count-amb-bg:  #FEF3C7; --count-amb-txt:  #92400E;
  --unassigned-border: #FEE2E2; --unassigned-hdr: #FEF2F2;
  --stat-total: #312E81;
  --shadow: 0 2px 10px rgba(0,0,0,0.07);
}

/* ── DARK THEME ──────────────────────────────────────────────────────────── */
[data-theme="dark"] {
  --bg: #0F172A; --card: #1E293B; --border: #334155; --text: #F1F5F9; --muted: #94A3B8;
  --row-hover: #1E3A5F; --row-hover-text: #818CF8;
  --acc-hover: #243044;
  --chip-total-bg: #1E2D5A; --chip-total-txt: #A5B4FC;
  --chip-today-bg: #2D2008; --chip-today-txt: #FCD34D;
  --chip-over-bg:  #2D0F0F; --chip-over-txt:  #FCA5A5;
  --count-red-bg:  #2D0F0F; --count-red-txt:  #FCA5A5;
  --count-amb-bg:  #2D2008; --count-amb-txt:  #FCD34D;
  --unassigned-border: #7F1D1D; --unassigned-hdr: #1C0A0A;
  --stat-total: #818CF8;
  --shadow: 0 2px 10px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background .25s, color .25s; }

/* HEADER */
.header { background: linear-gradient(135deg, #1E293B 0%, #312E81 100%); color: #fff; padding: 12px 32px 10px; display: flex; flex-direction: column; align-items: stretch; gap: 4px; }
.header-left h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.3px; white-space: nowrap; }
.header-left p  { color: #94A3B8; font-size: 0.78rem; white-space: nowrap; margin-top: 0; }.header-left { display: flex; align-items: center; gap: 10px; align-self: flex-start; }
.header-right   { display: flex; align-items: center; gap: 10px; align-self: flex-end; }
.header-right .date { font-size: 0.75rem; color: #CBD5E1; white-space: nowrap; }
.header-right .total-badge { background: rgba(255,255,255,0.15); border-radius: 20px; padding: 3px 11px; font-size: 0.72rem; color: #E2E8F0; white-space: nowrap; }

/* DARK MODE TOGGLE */
.theme-toggle { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 5px 12px; cursor: pointer; font-size: 0.78rem; color: #E2E8F0; display: flex; align-items: center; gap: 6px; transition: background .2s; white-space: nowrap; }
.theme-toggle:hover { background: rgba(255,255,255,0.22); }

/* STATS STRIP */

.stat-pill { background: var(--card); border-radius: 12px; padding: 14px 22px; box-shadow: var(--shadow); flex: 1; min-width: 140px; text-align: center; border: 1px solid var(--border); transition: background .25s, border-color .25s; }
.stat-pill .num  { font-size: 1.8rem; font-weight: 800; line-height: 1; }
.stat-pill .lbl  { font-size: 0.75rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .5px; }
.stat-pill.total  .num { color: var(--stat-total); }
.stat-pill.today  .num { color: #F59E0B; }
.stat-pill.over   .num { color: #EF4444; }
.stat-pill.unassigned .num { color: #EC4899; }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 20px; padding: 0 32px 32px; }

/* USER CARD */
.card { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow: hidden; transition: background .25s, border-color .25s; }
.card-header { padding: 20px 24px 16px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid var(--border); }
.avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; color: #fff; flex-shrink: 0; }
.card-title  { flex: 1; }
.card-title h2 { font-size: 1.05rem; font-weight: 700; }
.card-title p  { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.card-chips { display: flex; gap: 8px; padding: 14px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
.chip { font-size: 0.75rem; font-weight: 600; border-radius: 20px; padding: 4px 12px; }
.chip-total   { background: var(--chip-total-bg); color: var(--chip-total-txt); }
.chip-today   { background: var(--chip-today-bg); color: var(--chip-today-txt); }
.chip-overdue { background: var(--chip-over-bg);  color: var(--chip-over-txt); }
.est-row { padding: 10px 24px 14px; display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--muted); border-bottom: 1px solid var(--border); }
.est-row .est-val { font-weight: 700; color: var(--text); font-size: 0.9rem; }
.est-row .tooltip { position: relative; cursor: help; }
.est-row .tooltip:hover::after { content: attr(data-tip); position: absolute; bottom: 120%; left: 0; background: #1E293B; color: #fff; font-size: 0.72rem; padding: 5px 9px; border-radius: 6px; white-space: nowrap; z-index: 10; }

/* PRIORITY BAR */
.pbar-row  { padding: 10px 24px 14px; border-bottom: 1px solid var(--border); }
.pbar-row label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); display: block; margin-bottom: 6px; }
.pbar { display: flex; height: 8px; border-radius: 6px; overflow: hidden; gap: 2px; }
.pbar span { border-radius: 3px; transition: width .3s; }
.pbar-legend { display: flex; gap: 10px; margin-top: 7px; flex-wrap: wrap; }
.pbar-legend span { font-size: 0.68rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.pbar-legend span::before { content:''; width:8px; height:8px; border-radius:2px; display:inline-block; }

/* ACCORDIONS */
.acc { border-bottom: 1px solid var(--border); }
.acc:last-child { border-bottom: none; }
.acc-btn { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 13px 24px; background: none; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text); text-align: left; transition: background .15s; }
.acc-btn:hover { background: var(--acc-hover); }
.acc-btn .acc-label { display: flex; align-items: center; gap: 8px; }
.acc-btn .acc-count { font-size: 0.75rem; background: var(--border); color: var(--muted); border-radius: 12px; padding: 2px 9px; font-weight: 700; }
.acc-btn .acc-count.red   { background: var(--count-red-bg); color: var(--count-red-txt); }
.acc-btn .acc-count.amber { background: var(--count-amb-bg); color: var(--count-amb-txt); }
.acc-btn .chevron { color: var(--muted); font-size: 0.75rem; transition: transform .2s; }
.acc-btn.open .chevron { transform: rotate(180deg); }
.acc-body { display: none; max-height: 320px; overflow-y: auto; }
.acc-body.open { display: block; }
.task-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 24px; border-top: 1px solid var(--border); transition: background .1s; text-decoration: none; color: inherit; cursor: pointer; }
.task-row:hover { background: var(--row-hover); }
.task-row:hover .task-name { color: var(--row-hover-text); }
.priority-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
.task-info { flex: 1; min-width: 0; }
.task-name { font-size: 0.82rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .1s; }
.task-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; }
.task-meta .overdue-days { color: #EF4444; font-weight: 600; }
.task-link { color: #94A3B8; font-size: 0.8rem; flex-shrink: 0; }
.task-row:hover .task-link { color: var(--row-hover-text); }

/* UNASSIGNED */
.unassigned-section { margin: 0 32px 32px; }
.unassigned-card { background: var(--card); border: 2px solid var(--unassigned-border); border-radius: 16px; overflow: hidden; transition: background .25s; }
.unassigned-header { background: var(--unassigned-hdr); padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
.unassigned-header h3 { font-size: 1rem; font-weight: 700; color: var(--chip-over-txt); }
.unassigned-header p  { font-size: 0.8rem; color: var(--chip-over-txt); margin-top: 2px; }

/* RESPONSIVE */
@media (max-width: 600px) {
  .header { padding: 20px 16px; }
  .grid   { grid-template-columns: 1fr; padding: 0 16px 24px; }
  .unassigned-section { margin: 0 16px 24px; }

@media(max-width:600px){

// ── HELPERS ───────────────────────────────────────────────────────────────────
const PC = {urgent:"#EF4444", high:"#F97316", normal:"#3B82F6", low:"#10B981", null:"#9CA3AF"};

function pColor(p){ return PC[p] || PC.null; }

function fmtDate(ms){
  if(!ms) return "No due date";
  return new Date(ms).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric",timeZone:"Asia/Kolkata"});
}

function classify(d){
  if(!d) return "nodate";
  if(d < TODAY_START) return "overdue";
  if(d <= TODAY_END)  return "today";
  return "upcoming";
}

function overdueDays(d){
  return Math.floor((TODAY_START - d) / 86400000);
}

function fmsToDur(ms){
  if(!ms) return null;
  const h = Math.floor(ms/3600000);
  const m = Math.floor((ms%3600000)/60000);
  if(h && m) return h+"h "+m+"m";
  if(h) return h+"h";
  return m+"m";
}

// Merge TE into tasks
const TASKS = RAW.map(t => ({...t, te: TE[t.id] ?? null}));

// ── STATS ─────────────────────────────────────────────────────────────────────
const total     = TASKS.length;
const todayTasks = TASKS.filter(t => classify(t.d)==="today");
const overdueT  = TASKS.filter(t => classify(t.d)==="overdue");
const unassigned= TASKS.filter(t => t.a.length === 0);

// ── RENDER ────────────────────────────────────────────────────────────────────
function taskRow(t){
  const cls = classify(t.d);
  const od  = cls==="overdue" ? overdueDays(t.d) : 0;
  const dateTxt = cls==="overdue"
    ? `<span class="overdue-days">${od}d overdue</span> · ${fmtDate(t.d)}`
    : cls==="today"
    ? `<span style="color:#F59E0B;font-weight:600">Due today</span>`
    : fmtDate(t.d);
  const pLabel = t.p ? t.p.charAt(0).toUpperCase()+t.p.slice(1) : "–";
  return `<a class="task-row" href="${t.u}" target="_blank" rel="noopener noreferrer">
    <div class="priority-dot" style="background:${pColor(t.p)}"></div>
    <div class="task-info">
      <div class="task-name" title="${t.n.replace(/"/g,'&quot;')}">${t.n}</div>
      <div class="task-meta">${dateTxt} <span style="color:${pColor(t.p)}">${pLabel}</span> · ⏱ ${t.te ? fmsToDur(t.te) : '—'}${t.a.length>1?' · 👥 shared':''}</div>
    </div>
    <span class="task-link" title="Open in ClickUp">↗</span>
  </a>`;
}

function accordion(id, label, tasks, defaultOpen, countClass){
  if(!tasks.length) return '';
  const open = defaultOpen && tasks.length > 0;
  return `<div class="acc">
    <button class="acc-btn ${open?'open':''}" onclick="toggle(this)" id="btn-${id}">
      <span class="acc-label">${label}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span class="acc-count ${countClass||''}">${tasks.length}</span>
        <span class="chevron">▼</span>
      </span>
    </button>
    <div class="acc-body ${open?'open':''}" id="body-${id}">
      ${tasks.map(taskRow).join('')}
    </div>
  </div>`;
}

function toggle(btn){
  btn.classList.toggle('open');
  const body = document.getElementById('body-'+btn.id.replace('btn-',''));
  body.classList.toggle('open');
}

function priorityBar(tasks){
  const counts = {urgent:0,high:0,normal:0,low:0,none:0};
  tasks.forEach(t => { if(t.p) counts[t.p]=(counts[t.p]||0)+1; else counts.none++; });
  const tot = tasks.length || 1;
  const segs = ['urgent','high','normal','low','none'].map(k=>{
    const pct = (counts[k]/tot*100).toFixed(1);
    const col = k==='none' ? PC.null : PC[k];
    return counts[k] ? `<span style="width:${pct}%;background:${col}"></span>` : '';
  }).join('');
  const legend = ['urgent','high','normal'].map(k=>counts[k]?
    `<span style="--c:${PC[k]}"><span style="background:${PC[k]};width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px"></span>${counts[k]} ${k}</span>`:''
  ).filter(Boolean).join('');
  return `<div class="pbar-row">
    <label>Priority distribution</label>
    <div class="pbar">${segs}</div>
    <div class="pbar-legend">${legend}</div>
  </div>`;
}

function userCard(user){
  const myTasks  = TASKS.filter(t => t.a.includes(user.id));
  const today    = myTasks.filter(t => classify(t.d)==="today").sort((a,b)=>a.d-b.d);
  const overdue  = myTasks.filter(t => classify(t.d)==="overdue").sort((a,b)=>a.d-b.d);
  const nodate   = myTasks.filter(t => classify(t.d)==="nodate");

  const teSum   = today.reduce((s,t)=>s+(t.te||0),0);
  const noEstToday = today.filter(t=>t.te===null).length;
  const estTxt  = teSum ? fmsToDur(teSum) : '—';

  const uid = user.id;
  return `<div class="card">
    <div class="card-header">
      <div class="avatar" style="background:${user.color}">${user.initials}</div>
      <div class="card-title">
        <h2>${user.name}</h2>
        <p>${myTasks.length} tasks assigned · ${today.length} today · ${overdue.length} overdue</p>
      </div>
    </div>
    <div class="card-chips">
      <span class="chip chip-total">📋 ${myTasks.length} total</span>
      <span class="chip chip-today">🌅 ${today.length} due today</span>
      <span class="chip chip-overdue">🔴 ${overdue.length} overdue</span>
    </div>
    <div class="est-row">
      <span>⏱ Est. effort <span style="font-size:0.7rem;color:#94A3B8">(today's tasks)</span>:</span>
      <span class="est-val">${estTxt}</span>
      ${teSum ? `<span class="tooltip" data-tip="${noEstToday} of today's ${today.length} tasks have no estimate set">ℹ️</span>` : `<span style="font-size:0.75rem">(${today.length ? noEstToday+' tasks — no estimates set' : 'no tasks due today'})</span>`}
    </div>
    ${priorityBar(myTasks)}
    ${accordion('today-'+uid,'🌅 Due Today',today,false,'amber')}
    ${accordion('over-'+uid,'🔴 Overdue',overdue,false,'red')}
    ${nodate.length ? accordion('nd-'+uid,'📌 No Due Date',nodate,false,'') : ''}
  </div>`;
}

function buildUnassigned(){
  if(!unassigned.length) return '';
  return `<div class="unassigned-section">
    <div class="unassigned-card">
      <div class="unassigned-header">
        <div style="font-size:1.5rem">⚠️</div>
        <div>
          <h3>Unassigned Tasks — Action Required</h3>
          <p>${unassigned.length} task${unassigned.length>1?'s':''} with no assignee</p>
        </div>
      </div>
      ${unassigned.map(taskRow).join('')}
    </div>
  </div>`;
}

function crmSection(uid){
  const leads=CRM_OVERDUE[uid]||[];
  const tl={CALL:'📞 Call',WHATSAPP:'💬 WhatsApp',LINKEDIN:'🔗 LinkedIn',EMAIL:'✉️ Email',MEETING:'📅 Meeting'};
  if(!leads.length) return '<div class="crm-section"><div class="crm-section-title">🟢 CRM — no overdue follow-ups</div></div>';
  const rows=leads.map(l=>'<div class="crm-lead-row"><div><div class="crm-lead-name">'+l.name+'</div>'+(l.co?'<div class="crm-lead-co">'+l.co+'</div>':'')+'</div><span class="crm-badge '+l.type+'">'+(tl[l.type]||l.type)+'</span></div>').join('');
  return '<div class="crm-section"><div class="crm-section-title">🔴 CRM overdue ('+leads.length+')</div>'+rows+'</div>';
}
function pipelineStrip(){
  const stages=CRM_PIPELINE.map(s=>'<div class="pipe-stage"><div class="pipe-bar" style="background:'+s.color+'"></div><div class="pipe-count">'+s.count+'</div><div class="pipe-label">'+s.label+'</div></div>').join('');
  return '<div class="pipeline-strip">'+stages+'</div>';
}
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <div class="header-left">
        <h1>Work To Do's Dashboard</h1>
        <span class="sep">·</span>
        <p>Rathi Financial &nbsp;·&nbsp; Work To Do's &amp; Deals &nbsp;·&nbsp; Live snapshot</p>
      </div>
      <div class="header-right">
        <div class="date">${TODAY_LABEL} &nbsp;·&nbsp; Updated ${UPDATE_TIME}</div>
        <div class="total-badge">${total} total tasks</div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark mode</button>
      </div>
    </div>

    <div class="stats">
      <div class="stats-group">
        <div class="stats-group-label">ClickUp</div>
        <div class="stats-pills">
          <div class="stat-pill total"><div class="num">${total}</div><div class="lbl">Total Tasks</div></div>
          <div class="stat-pill today"><div class="num">${todayTasks.length}</div><div class="lbl">Due Today</div></div>
          <div class="stat-pill over"><div class="num">${overdueT.length}</div><div class="lbl">Overdue</div></div>
          <div class="stat-pill unassigned"><div class="num">${unassigned.length}</div><div class="lbl">Unassigned</div></div>
        </div>
      </div>
      <div class="stats-sep"></div>
      <div class="stats-group">
        <div class="stats-group-label">Vayu CRM</div>
        <div class="stats-pills">
          <div class="stat-pill crm-leads"><div class="num">${CRM_TOTAL_LEADS}</div><div class="lbl">Active Pipeline</div></div>
          <div class="stat-pill crm-over"><div class="num">${CRM_OVERDUE_TOTAL}</div><div class="lbl">Overdue Follow-ups</div></div>
        </div>
      </div>
    </div>

    ${pipelineStrip()}    <div class="grid">
      ${USERS.map(userCard).join('')}
    </div>

    ${buildUnassigned()}
  `;
}

// ── DARK MODE ─────────────────────────────────────────────────────────────────
function applyTheme(dark){
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = dark ? '☀️ Light mode' : '🌙 Dark mode';
}
function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
  applyTheme(!isDark);
}
// Apply saved preference immediately
applyTheme(localStorage.getItem('theme') === 'dark');

render();
</script>
</body>
